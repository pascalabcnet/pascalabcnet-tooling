name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    name: Build and smoke tests
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PascalABCNet.Tooling.slnx

      - name: Build
        run: dotnet build PascalABCNet.Tooling.slnx --configuration Release --no-restore -m:1 -p:UseSharedCompilation=false

      - name: Run headless IntelliSense smoke tests
        run: dotnet run --project HeadlessSmokeTest/HeadlessSmokeTest.csproj --configuration Release --no-build

      - name: Run LSP smoke tests
        run: dotnet run --project LanguageServerSmokeTest/LanguageServerSmokeTest.csproj --configuration Release --no-build
        env:
          PABC_TOOLING_SERVER_ASSEMBLY: ${{ github.workspace }}\PascalABCNet.LanguageServer\bin\Release\net10.0\PascalABCNet.LanguageServer.dll
